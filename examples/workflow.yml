# Copy to .github/workflows/e2e.yml in your project.
name: e2e
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spectra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test

      - name: Spectra Report
        if: always()
        uses: surkuar/spectra-report@v0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # fail-on-failure: true    # make the step red when tests fail
